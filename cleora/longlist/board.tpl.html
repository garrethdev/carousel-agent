<title>Cleora Long List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#e9ece7; --surface:#fbfcfa; --surface-2:#f1f4ef;
  --ink:#1b211e; --ink-2:#4a544f; --ink-3:#727d77;
  --line:#d3d9d2; --line-2:#c0c8bf;
  --brass:#8a6a1f; --brass-soft:#efe6cd;
  --keep:#2c6350; --keep-soft:#dcebe4;
  --cut:#8d3a2c; --cut-soft:#f2e0dc;
  --shadow:0 1px 2px rgba(27,33,30,.06);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111513; --surface:#191e1b; --surface-2:#1f2521;
    --ink:#e7ece8; --ink-2:#a5b0aa; --ink-3:#7d8a83;
    --line:#2a312d; --line-2:#3a433d;
    --brass:#d3a850; --brass-soft:#33291360;
    --keep:#63b394; --keep-soft:#1b3a2f60;
    --cut:#d8776a; --cut-soft:#3d201b60;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#111513; --surface:#191e1b; --surface-2:#1f2521;
  --ink:#e7ece8; --ink-2:#a5b0aa; --ink-3:#7d8a83;
  --line:#2a312d; --line-2:#3a433d;
  --brass:#d3a850; --brass-soft:#33291360;
  --keep:#63b394; --keep-soft:#1b3a2f60;
  --cut:#d8776a; --cut-soft:#3d201b60;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.55 "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px; margin:0 auto; padding:0 20px 96px}

/* ---- header ---- */
header{padding:38px 0 20px}
h1{
  font:600 40px/1.05 "Cormorant Garamond", Georgia, serif;
  margin:0 0 6px; letter-spacing:.01em; text-wrap:balance;
}
.sub{color:var(--ink-2); max-width:62ch; margin:0}
.sub b{color:var(--ink); font-weight:600}

/* ---- sticky control bar ---- */
.bar{
  position:sticky; top:0; z-index:20; margin:20px 0 0;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:12px 14px;
  display:flex; flex-wrap:wrap; align-items:center; gap:12px;
}
.tally{
  font:500 13px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing:.04em; color:var(--ink-2);
  display:flex; align-items:baseline; gap:7px; white-space:nowrap;
}
.tally .n{font-size:22px; color:var(--brass)}
.tally .n.full{color:var(--keep)}
.meter{flex:1; min-width:120px; height:5px; background:var(--surface-2);
  border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.meter i{display:block; height:100%; width:0; background:var(--brass); transition:width .25s ease}
.meter i.full{background:var(--keep)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
.chip{
  font:400 12.5px/1 "Source Sans 3", sans-serif; color:var(--ink-2);
  background:var(--surface-2); border:1px solid var(--line);
  padding:6px 10px; border-radius:99px; cursor:pointer;
}
.chip:hover{border-color:var(--line-2); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brass-soft); border-color:var(--brass); color:var(--ink)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

/* ---- rows ---- */
ol{list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
li{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; display:grid; grid-template-columns:1fr auto; gap:14px 18px;
  align-items:start; box-shadow:var(--shadow);
}
li[data-v="1"]{border-color:var(--keep); background:var(--keep-soft)}
li[data-v="-1"]{opacity:.42}
li[hidden]{display:none}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:5px}
.terr{
  font:400 11px/1 "Source Sans 3", sans-serif; text-transform:uppercase;
  letter-spacing:.09em; color:var(--ink-3);
}
.pips{font:500 11px/1 "IBM Plex Mono", monospace; color:var(--ink-3);
  letter-spacing:.06em; font-variant-numeric:tabular-nums}
.warn{
  font:400 11.5px/1 "Source Sans 3", sans-serif; color:var(--brass);
  background:var(--brass-soft); border:1px solid var(--brass);
  padding:3px 7px; border-radius:4px;
}
h2{font:600 21px/1.2 "Cormorant Garamond", Georgia, serif; margin:0 0 7px; text-wrap:balance}
.anchor{margin:0 0 7px; color:var(--ink-2)}
.felt{margin:0; color:var(--ink-3); font-style:italic; font-size:14px}
.card{
  margin:9px 0 0; font:500 11.5px/1.35 "IBM Plex Mono", monospace;
  letter-spacing:.03em; color:var(--brass); text-transform:uppercase;
}
.acts{display:flex; flex-direction:column; gap:7px}
.acts button{
  font:600 12.5px/1 "Source Sans 3", sans-serif; letter-spacing:.03em;
  padding:9px 15px; border-radius:7px; cursor:pointer; min-width:74px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.acts button:hover{border-color:var(--line-2); color:var(--ink)}
.acts .k[aria-pressed="true"]{background:var(--keep); border-color:var(--keep); color:#fff}
.acts .x[aria-pressed="true"]{background:var(--cut); border-color:var(--cut); color:#fff}
.src{margin:8px 0 0; font-size:12.5px}
.src a{color:var(--ink-3); text-decoration:none; border-bottom:1px solid var(--line-2); margin-right:11px}
.src a:hover{color:var(--brass); border-color:var(--brass)}
.note{margin:22px 0 0; padding:13px 15px; border-left:2px solid var(--line-2);
  color:var(--ink-3); font-size:13.5px}
.note code{font:500 12px "IBM Plex Mono", monospace; color:var(--ink-2)}
@media (max-width:620px){
  li{grid-template-columns:1fr}
  .acts{flex-direction:row}
  h1{font-size:32px}
  .chips{margin-left:0; width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <h1>Cleora Long List</h1>
  <p class="sub">Every candidate the scouts brought back, already cut for duplicates and for
  anything that collides with the existing slate. <b>Keep 20.</b> Everything you keep gets a
  full script; everything else is dropped.</p>
</header>

<div class="bar">
  <div class="tally"><span class="n" id="n">0</span><span>/ /*__TARGET__*/20 kept</span></div>
  <div class="meter"><i id="meter"></i></div>
  <div class="chips">
    <button class="chip" data-terr="" aria-pressed="true">All <!--__COUNT__--></button>
    <!--__TERRS__-->
    <button class="chip" data-terr="__kept">Kept</button>
    <button class="chip" data-terr="__undecided">Undecided</button>
  </div>
</div>

<ol id="list"></ol>

<p class="note" id="note">Choices save as you make them.</p>
</div>

<script>
const DATA = /*__DATA__*/;
const TARGET = /*__TARGET__*/20;
const V = Object.create(null);
let DB = null, filter = "";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function pips(n){ return "●".repeat(n) + "○".repeat(3 - n); }

function render(){
  $("list").innerHTML = DATA.map(c => `
    <li data-id="${esc(c.id)}" data-terr="${esc(c.terr)}">
      <div>
        <div class="meta">
          <span class="terr">${esc(c.terrName)}</span>
          <span class="pips" title="interesting / payoff">${pips(c.si)} ${pips(c.sa)}</span>
          ${c.shares ? `<span class="warn">same subject as &ldquo;${esc(c.shares)}&rdquo;</span>` : ""}
        </div>
        <h2>${esc(c.title)}</h2>
        <p class="anchor">${esc(c.anchor)}</p>
        ${c.felt ? `<p class="felt">Speaks to: ${esc(c.felt)}</p>` : ""}
        ${c.card ? `<p class="card">${esc(c.card)}</p>` : ""}
        ${c.srcs.length ? `<p class="src">${c.srcs.map((u,i) =>
          `<a href="${esc(u)}" target="_blank" rel="noopener">source ${i+1}</a>`).join("")}</p>` : ""}
      </div>
      <div class="acts">
        <button class="k" data-vote="1"  aria-pressed="false">Keep</button>
        <button class="x" data-vote="-1" aria-pressed="false">Cut</button>
      </div>
    </li>`).join("");
  paint();
}

function paint(){
  let kept = 0;
  document.querySelectorAll("#list li").forEach(li => {
    const id = li.dataset.id, v = V[id] || 0;
    if (v === 1) kept++;
    li.dataset.v = v || "";
    li.querySelector(".k").setAttribute("aria-pressed", v === 1);
    li.querySelector(".x").setAttribute("aria-pressed", v === -1);
    let show = true;
    if (filter === "__kept") show = v === 1;
    else if (filter === "__undecided") show = !v;
    else if (filter) show = li.dataset.terr === filter;
    li.hidden = !show;
  });
  const full = kept >= TARGET;
  $("n").textContent = kept;
  $("n").classList.toggle("full", full);
  const bar = $("meter");
  bar.style.width = Math.min(100, kept / TARGET * 100) + "%";
  bar.classList.toggle("full", full);
}

document.addEventListener("click", async e => {
  const chip = e.target.closest(".chip");
  if (chip){
    filter = chip.dataset.terr;
    document.querySelectorAll(".chip").forEach(c =>
      c.setAttribute("aria-pressed", c === chip));
    paint(); return;
  }
  const btn = e.target.closest("[data-vote]");
  if (!btn) return;
  const li = btn.closest("li"), id = li.dataset.id;
  const want = Number(btn.dataset.vote);
  V[id] = V[id] === want ? 0 : want;
  paint();
  if (!DB) return;
  const row = DATA.find(c => c.id === id);
  try {
    if (V[id]) await DB.collection("longlist").doc(id).set(
      { id, title: row.title, territory: row.terr, vote: V[id], at: Date.now() });
    else await DB.collection("longlist").doc(id).delete();
  } catch (err) {
    $("note").textContent = "That choice did not save — " + (err && err.code || "unknown") +
      ". Your other choices are unaffected.";
  }
});

render();

claude.use("db").then(db => {
  DB = db;
  if (!DB){
    $("note").textContent = "Working offline — choices show here but are not being saved. " +
      "Tell Claude your picks by name instead.";
    return;
  }
  DB.collection("longlist").onSnapshot(snap => {
    // QuerySnapshot exposes `docs`, an array - it has no forEach of its own.
    // Build the next state fully before touching V, so a bad snapshot can
    // never leave the page with the selections already cleared.
    const next = Object.create(null);
    (snap.docs || []).forEach(d => {
      const r = (d.exists ? d.data() : null) || {};
      if (r.vote) next[d.id] = r.vote;
    });
    for (const k in V) delete V[k];
    Object.assign(V, next);
    paint();
  }, err => {
    $("note").textContent = "Live sync stopped (" + (err && err.code || "unknown") +
      "). Reload to reconnect.";
  });
});
</script>
